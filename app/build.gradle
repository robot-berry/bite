plugins { id 'com.android.application' }

android {
    namespace 'com.qinghe.account'
    compileSdk 35

    defaultConfig {
        applicationId 'com.qinghe.account'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
}

def webAssets = layout.projectDirectory.dir('src/main/assets')
tasks.register('syncWebAssets', Sync) {
    from(rootProject.projectDir) {
        include 'index.html', 'styles.css', 'app.js', 'crop.js', 'icon.svg', 'manifest.webmanifest'
    }
    into(webAssets)
}
tasks.named('preBuild').configure { dependsOn('syncWebAssets') }
